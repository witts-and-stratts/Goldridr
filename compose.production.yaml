name: goldridr-production

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  pocketbase:
    image: ${POCKETBASE_IMAGE:-ghcr.io/witts-and-stratts/goldridr-pocketbase:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POCKETBASE_HOST_PORT:-8091}:8090"
    volumes:
      - ./pocketbase-data:/pb/pb_data
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb/pb_data
      - --migrationsDir=/pb/pb_migrations
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    image: ${IMAGE_NAME:-ghcr.io/witts-and-stratts/goldridr:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      POCKETBASE_URL: ${POCKETBASE_URL:?POCKETBASE_URL must be http://pocketbase:8090}
    depends_on:
      pocketbase:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./.next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  notifications-worker:
    image: ${WORKER_IMAGE:-ghcr.io/witts-and-stratts/goldridr-worker:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POCKETBASE_URL: ${POCKETBASE_URL:?POCKETBASE_URL must be http://pocketbase:8090}
      NOTIFICATION_READY_FILE: /tmp/notification-worker.ready
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/notification-worker.ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
