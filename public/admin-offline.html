<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171717">
    <title>GoldRidr Admin — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); display: grid; place-items: center; background: oklch(0.145 0 0); color: oklch(0.985 0 0); }
      main { width: min(100%, 28rem); text-align: center; }
      img { width: 5rem; height: 5rem; margin-bottom: 1.5rem; }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0 auto 1.75rem; max-width: 34ch; color: oklch(0.708 0 0); line-height: 1.6; }
      button { min-width: 8rem; min-height: 2.75rem; border: 0; border-radius: 0.5rem; padding: 0.75rem 1rem; background: oklch(0.922 0 0); color: oklch(0.205 0 0); font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid oklch(0.985 0 0); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/admin-icons/icon-192.png" alt="">
      <h1>You’re offline</h1>
      <p>GoldRidr Admin needs a secure connection to load current bookings and fleet data. Your changes have not been queued.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
